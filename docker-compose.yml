services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maxwell-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-shared-mysql}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-maxsel_db}
      - DB_PORT=${DB_PORT:-3306}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@maxsel.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-maxsel_super_secret_jwt_key_2026_secure}
      - UPLOADS_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8005:8000"
    networks:
      - shared-db-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maxwell-website
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://maxwell-backend:8000
    ports:
      - "3005:3000"
    depends_on:
      - backend
    networks:
      - shared-db-network

networks:
  shared-db-network:
    external: true
